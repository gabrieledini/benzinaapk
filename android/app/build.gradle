plugins { id 'com.android.application' }

android {
    namespace 'it.gabriele.allapompa'
    compileSdk 35

    defaultConfig {
        applicationId "it.gabriele.allapompa"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // firmato con la chiave di debug: basta per il sideload
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
